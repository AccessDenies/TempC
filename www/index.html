<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#f4f7ff">
    <title>Temperature Converter</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="splashScreen" class="splash-screen" aria-live="polite" aria-label="Splash screen">
        <img
            id="splashImage"
            class="splash-image"
            src="assets/tapman-splash.png"
            alt="TAPMAN splash art"
            decoding="sync"
        >
    </div>

    <main class="app app--hidden" id="app">
        <header class="app-header">
            <div class="app-icon">🌡️</div>
            <p class="eyebrow">SMART CONVERTER</p>
            <h1>Temperature Converter</h1>
            <p class="subtitle">
                Convert temperatures instantly and easily.
            </p>
        </header>

        <section class="converter-card">
            <div class="card-heading">
                <h2>Temperature</h2>
                <span class="live-badge">
                    <span class="status-dot"></span>
                    Live
                </span>
            </div>

            <div class="temp-container">
                <label for="celsius">
                    <span class="unit-icon">°C</span>
                    Celsius
                </label>
                <div class="input-wrap">
                    <input
                        type="number"
                        id="celsius"
                        name="celsius"
                        class="input"
                        placeholder="0.00"
                        step="any"
                        inputmode="decimal"
                        autocomplete="off"
                    >
                    <span class="unit">°C</span>
                </div>
            </div>

            <div class="temp-container">
                <label for="fahrenheit">
                    <span class="unit-icon">°F</span>
                    Fahrenheit
                </label>
                <div class="input-wrap">
                    <input
                        type="number"
                        id="fahrenheit"
                        name="fahrenheit"
                        class="input"
                        placeholder="32.00"
                        step="any"
                        inputmode="decimal"
                        autocomplete="off"
                    >
                    <span class="unit">°F</span>
                </div>
            </div>

            <div class="temp-container">
                <label for="kelvin">
                    <span class="unit-icon">K</span>
                    Kelvin
                </label>
                <div class="input-wrap">
                    <input
                        type="number"
                        id="kelvin"
                        name="kelvin"
                        class="input"
                        placeholder="273.15"
                        step="any"
                        inputmode="decimal"
                        autocomplete="off"
                    >
                    <span class="unit">K</span>
                </div>
            </div>

            <button type="button" id="resetBtn" class="reset-btn">
                <span>↻</span>
                Reset Converter
            </button>
        </section>
    </main>

    <script src="index.js"></script>
</body>
</html>
